[project]
name = "ecomap"
version = "0.1.0"
description = "Videomapping con un proyector, una Raspberry Pi y una camara, configurado desde la web"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]
render = [
    "moderngl>=5.12",
    "moderngl-window>=3.0",
    "numpy>=2.0",
]
vision = [
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
]
# Solo para el modo de salida kms (Raspberry Pi sin escritorio): SDL2 con backend KMSDRM.
kms = [
    "pygame>=2.6",
]
# Solo para el modo de salida window. moderngl-window trae pyglet, no glfw, asi
# que sin esto el modo window falla con ModuleNotFoundError al crear la ventana.
window = [
    "glfw>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
ecomap-web = "ecomap_web.main:run"
ecomap-render = "ecomap_render.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ecomap_core",
    "src/ecomap_web",
    "src/ecomap_render",
    "src/ecomap_vision",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:ecomap_.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
